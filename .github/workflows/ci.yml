# CI runs the same gates every round of development runs locally: formatting,
# vet, the full test suite with the race detector, and a build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -timeout 10m ./...

      - name: build
        run: go build ./...

      - name: rask
        run: go run .

